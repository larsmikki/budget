services:
  ledger:
    image: larsmikki/ledger:latest
    container_name: ledger
    ports:
      - "3000:3000"
    volumes:
      - ledger-data:/app/data
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 5m
      timeout: 10s
      retries: 3

volumes:
  ledger-data:
