services:
  spendr:
    image: larsmikki/spendr:latest
    container_name: spendr
    ports:
      - "3000:3000"
    volumes:
      - spendr-data:/app/data
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 5m
      timeout: 10s
      retries: 3

volumes:
  spendr-data: